services:
  postgres:
    image: postgres:16-alpine
    container_name: contacarros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contacarros}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-contacarros}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
    container_name: contacarros-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      APP_BASE_PATH: ${APP_BASE_PATH:-/}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4173,http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRES_IN: 12h
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contacarros}?schema=public
      PLACA_FIPE_BASE_URL: ${PLACA_FIPE_BASE_URL:-}
      PLACA_FIPE_TOKEN: ${PLACA_FIPE_TOKEN:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "BASE=\"${APP_BASE_PATH:-/}\"; BASE=\"$${BASE%/}\"; [ -z \"$$BASE\" ] && URL=\"http://localhost:3000/health\" || URL=\"http://localhost:3000$$BASE/health\"; wget -qO- \"$$URL\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./apps/frontend
      args:
        VITE_APP_BASE_PATH: ${APP_BASE_PATH:-/}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
    container_name: contacarros-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4173}:4173"
    environment:
      VITE_APP_BASE_PATH: ${APP_BASE_PATH:-/}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}

volumes:
  postgres_data:
